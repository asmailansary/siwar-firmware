# ---- السجلات (للتطوير)
CONFIG_LOG=y

# ---- الأزرار والإضاءة (لوحة التطوير)
CONFIG_DK_LIBRARY=y

# ---- الشبكة الخلوية والإنذار والرسائل
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_AT_MONITOR=y
CONFIG_SMS=y

# ---- حفظ قائمة الأهل داخل السوار
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
